<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi Algoritma Pencarian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        .bar-container {
            height: 350px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            background: #1e293b;
            border-radius: 16px;
        }
        .bar {
            background-color: #3b82f6;
            border-radius: 8px 8px 4px 4px;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .bar-label {
            position: absolute;
            top: -35px;
            background: #334155;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #475569;
        }
        .pointer {
            position: absolute;
            bottom: -30px;
            color: #fbbf24;
            transition: all 0.3s ease;
        }
        .active-bar { background-color: #fbbf24 !important; transform: scaleX(1.1); }
        .success-bar { background-color: #22c55e !important; }
        .fail-bar { background-color: #ef4444 !important; opacity: 0.5; }
        .range-bar { background-color: #6366f1 !important; } /* For binary search bounds */

        input[type="range"] {
            accent-color: #3b82f6;
        }
        select, input[type="number"] {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
        }
        button {
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header & Stats -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <h1 class="text-2xl font-bold">Visualisasi Algoritma Pencarian</h1>
            <div class="flex gap-6 text-sm">
                <div>
                    <p class="text-slate-400 uppercase text-xs font-semibold">Algoritma</p>
                    <p id="stat-algo" class="font-medium text-blue-400">Linear Search</p>
                </div>
                <div>
                    <p class="text-slate-400 uppercase text-xs font-semibold">Perbandingan</p>
                    <p id="stat-comparisons" class="font-medium">0</p>
                </div>
                <div>
                    <p class="text-slate-400 uppercase text-xs font-semibold">Status</p>
                    <p id="stat-status" class="font-medium text-yellow-400">Siap</p>
                </div>
            </div>
        </div>

        <!-- Main Visualization Canvas -->
        <div id="visual-area" class="bar-container mb-8 relative">
            <!-- Bars will be injected here -->
        </div>

        <!-- Controls -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Left Controls -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium">Algoritma</label>
                        <select id="algo-select" class="w-48">
                            <option value="linear">Linear Search</option>
                            <option value="binary">Binary Search (Auto-Sort)</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium">Cari Angka</label>
                        <input type="number" id="target-input" value="50" class="w-20 text-center">
                    </div>
                </div>

                <!-- Right Controls -->
                <div class="space-y-4">
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between">
                            <label class="text-sm font-medium">Ukuran Data</label>
                            <span id="size-val" class="text-xs bg-slate-700 px-2 rounded">10</span>
                        </div>
                        <input type="range" id="size-slider" min="5" max="20" value="10" class="w-full">
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between">
                            <label class="text-sm font-medium">Kecepatan (detik)</label>
                            <span id="speed-val" class="text-xs bg-slate-700 px-2 rounded">0.5s</span>
                        </div>
                        <input type="range" id="speed-slider" min="1" max="20" value="5" class="w-full">
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button id="btn-run" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold shadow-lg shadow-blue-900/20">Jalankan</button>
                <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-bold">Acak Ulang</button>
            </div>
        </div>
    </div>

    <script>
        const visualArea = document.getElementById('visual-area');
        const algoSelect = document.getElementById('algo-select');
        const targetInput = document.getElementById('target-input');
        const sizeSlider = document.getElementById('size-slider');
        const speedSlider = document.getElementById('speed-slider');
        const btnRun = document.getElementById('btn-run');
        const btnReset = document.getElementById('btn-reset');
        
        const statAlgo = document.getElementById('stat-algo');
        const statComp = document.getElementById('stat-comparisons');
        const statStatus = document.getElementById('stat-status');

        let data = [];
        let isRunning = false;
        let comparisons = 0;

        // Initialize
        function init() {
            generateData();
            updateLabels();
        }

        function updateLabels() {
            document.getElementById('size-val').innerText = sizeSlider.value;
            document.getElementById('speed-val').innerText = (speedSlider.value / 10).toFixed(1) + 's';
            statAlgo.innerText = algoSelect.options[algoSelect.selectedIndex].text;
        }

        function generateData() {
            if (isRunning) return;
            const size = parseInt(sizeSlider.value);
            data = Array.from({ length: size }, () => Math.floor(Math.random() * 90) + 10);
            
            if (algoSelect.value === 'binary') {
                data.sort((a, b) => a - b);
            }
            
            renderBars();
            comparisons = 0;
            statComp.innerText = '0';
            statStatus.innerText = 'Siap';
            statStatus.className = 'font-medium text-yellow-400';
            btnRun.disabled = false;
            btnRun.innerText = 'Jalankan';
        }

        function renderBars(activeIndex = -1, successIndex = -1, failIndices = [], rangeIndices = []) {
            visualArea.innerHTML = '';
            const containerWidth = visualArea.clientWidth - 40;
            const barWidth = (containerWidth / data.length) - 8;

            data.forEach((val, i) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${val * 3}px`;
                bar.style.width = `${barWidth}px`;
                
                if (i === activeIndex) bar.classList.add('active-bar');
                if (i === successIndex) bar.classList.add('success-bar');
                if (failIndices.includes(i)) bar.classList.add('fail-bar');
                if (rangeIndices.includes(i)) bar.classList.add('range-bar');

                const label = document.createElement('div');
                label.className = 'bar-label';
                label.innerText = val;
                bar.appendChild(label);

                if (i === activeIndex) {
                    const ptr = document.createElement('div');
                    ptr.className = 'pointer';
                    ptr.innerHTML = '▲';
                    bar.appendChild(ptr);
                }

                visualArea.appendChild(bar);
            });
        }

        async function sleep() {
            const ms = speedSlider.value * 100;
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function linearSearch() {
            const target = parseInt(targetInput.value);
            statStatus.innerText = 'Mencari...';
            
            for (let i = 0; i < data.length; i++) {
                if (!isRunning) return;
                
                comparisons++;
                statComp.innerText = comparisons;
                renderBars(i);
                await sleep();

                if (data[i] === target) {
                    renderBars(-1, i);
                    statStatus.innerText = 'Ditemukan!';
                    statStatus.className = 'font-medium text-green-400';
                    isRunning = false;
                    return;
                }
            }
            
            statStatus.innerText = 'Tidak Ada';
            statStatus.className = 'font-medium text-red-400';
            renderBars(-1, -1, data.map((_, i) => i));
            isRunning = false;
        }

        async function binarySearch() {
            const target = parseInt(targetInput.value);
            statStatus.innerText = 'Mencari (Binary)...';
            
            let low = 0;
            let high = data.length - 1;
            let fails = [];

            while (low <= high) {
                if (!isRunning) return;

                let mid = Math.floor((low + high) / 2);
                comparisons++;
                statComp.innerText = comparisons;
                
                // Visual range indices
                let range = [];
                for(let k=low; k<=high; k++) range.push(k);

                renderBars(mid, -1, fails, range);
                await sleep();

                if (data[mid] === target) {
                    renderBars(-1, mid);
                    statStatus.innerText = 'Ditemukan!';
                    statStatus.className = 'font-medium text-green-400';
                    isRunning = false;
                    return;
                }

                if (data[mid] < target) {
                    for(let k=low; k<=mid; k++) fails.push(k);
                    low = mid + 1;
                } else {
                    for(let k=mid; k<=high; k++) fails.push(k);
                    high = mid - 1;
                }
            }

            statStatus.innerText = 'Tidak Ada';
            statStatus.className = 'font-medium text-red-400';
            renderBars(-1, -1, Array.from({length: data.length}, (_, i) => i));
            isRunning = false;
        }

        // Event Listeners
        btnRun.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
                btnRun.innerText = 'Jalankan';
                return;
            }
            
            isRunning = true;
            btnRun.innerText = 'Berhenti';
            if (algoSelect.value === 'linear') {
                linearSearch();
            } else {
                binarySearch();
            }
        });

        btnReset.addEventListener('click', () => {
            isRunning = false;
            generateData();
        });

        algoSelect.addEventListener('change', () => {
            updateLabels();
            generateData();
        });

        sizeSlider.addEventListener('input', () => {
            updateLabels();
            generateData();
        });

        speedSlider.addEventListener('input', updateLabels);

        // Resize handler to fix bar widths
        window.addEventListener('resize', renderBars);

        init();
    </script>
</body>
</html>
